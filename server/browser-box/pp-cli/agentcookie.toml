# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "browser-box-pp-cli"
display_name = "browser-box"
description = "Your own browser box from the command line, plus the memory the box does not keep: call history, a page cache, full-text search and batched reads that retry busy refusals."
project_kind = "cli"

[secrets.file]
path = "~/.config/browser-box-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
BROWSER_BOX_TOKEN = true

[project]
name = "browser-box-cli"
version = "0.1.0"
description = "bb — chat with, or drive, a self-hosted browser-box gateway over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.30.0", "httpx>=0.28.1"]

[project.scripts]
bb = "browser_box_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["browser_box_cli*"]

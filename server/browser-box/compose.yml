# One door, no browser on this host: the browsers are hosted (Browser Use Cloud, Browserbase).
# Nothing is published beyond loopback; Caddy is the only public surface.
services:
  agent-browseruse:
    # Browser-Use behind task(surface="browser"): an LLM step loop that drives a hosted browser
    # the gateway opens for each task, over CDP. No browser of its own. The step model runs on
    # OpenRouter with this box's key. Its port is never published; only the gateway reaches it,
    # with BB_BROWSERUSE_TOKEN.
    build: ./agents/browseruse
    profiles: [browseruse]
    restart: unless-stopped
    environment:
      # Empty token = it refuses to start (it listens on the compose network, not loopback).
      - BU_TOKEN=${BB_BROWSERUSE_TOKEN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - BU_MODEL=${BB_BROWSERUSE_MODEL:-z-ai/glm-5.3-flash}
      - BU_REASONING_EFFORT=${BB_BROWSERUSE_REASONING_EFFORT:-low}
      # Empty: no shared browser; every task brings the hosted browser the gateway opened for it.
      - CDP_URL=
      # Each task gets a hosted browser of its own. 0 = no cap of ours (Browser Use's plan limit is
      # the ceiling). Each task is a child process of ~100-300 MB: BROWSERUSE_MEMORY is the real bound.
      - BU_PARALLEL=${BB_BROWSERUSE_PARALLEL:-0}
    deploy:
      resources:
        limits:
          memory: ${BROWSERUSE_MEMORY:-1200m}
          cpus: "${BROWSERUSE_CPUS:-0.6}"
    networks: [box]

  gateway:
    # The only thing that talks to the outside world. No browser, no LLM.
    build: ./gateway
    restart: unless-stopped
    environment:
      - BB_TOKEN=${BB_TOKEN:?set BB_TOKEN in .env}
      - BB_LANE_LOCK=/lane/lane.lock
      - BB_LANE_WAIT_SECONDS=${BB_LANE_WAIT_SECONDS:-120}
      - BB_LOG_LEVEL=${BB_LOG_LEVEL:-INFO}
      # Orgo cloud computers. Empty key = the computer and task tools are not listed at all.
      - ORGO_API_KEY=${ORGO_API_KEY:-}
      - ORGO_COMPUTER_ID=${ORGO_COMPUTER_ID:-}
      - ORGO_MODEL=${ORGO_MODEL:-claude-sonnet-5}
      - BB_ORGO_AUTOCREATE=${BB_ORGO_AUTOCREATE:-}
      # Browser-Use (task on the browser). Empty = task(surface="browser") is not offered.
      - BB_BROWSERUSE_URL=${BB_BROWSERUSE_URL:-}
      - BB_BROWSERUSE_TOKEN=${BB_BROWSERUSE_TOKEN:-}
      # Browser Use Cloud: the browsers for read, session, act and task. Empty = only Browserbase reads.
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY:-}
      - BB_BROWSERUSE_MONTHLY_USD=${BB_BROWSERUSE_MONTHLY_USD:-10}
      - BB_BROWSERUSE_MAX_CONCURRENT=${BB_BROWSERUSE_MAX_CONCURRENT:-10}
      - BB_BROWSERUSE_SESSION_MINUTES=${BB_BROWSERUSE_SESSION_MINUTES:-5}
      # act on hosted browsers: Jev (TypeSafe) picks the element. With BROWSER_USE_API_KEY, this lists act.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - BB_DECISION_URL=${BB_DECISION_URL:-}
      - BB_DECISION_MODEL=${BB_DECISION_MODEL:-}
      - BB_SESSION_IDLE_SECONDS=${BB_SESSION_IDLE_SECONDS:-300}
      - BB_SESSION_MAX_MINUTES=${BB_SESSION_MAX_MINUTES:-60}
      - BB_SOLVE_CAPTCHAS=${BB_SOLVE_CAPTCHAS:-1}
      - BB_OWNED_BROWSERS=/lane/owned-browsers.json
      - BB_SESSION_WAIT_SECONDS=${BB_SESSION_WAIT_SECONDS:-30}
      - BB_FETCH_TIMEOUT_SECONDS=${BB_FETCH_TIMEOUT_SECONDS:-30}
      - BB_MAX_REDIRECTS=${BB_MAX_REDIRECTS:-8}
      # Browserbase: read's hosted fallback (docs/choosing.md).
      - BROWSERBASE_API_KEY=${BROWSERBASE_API_KEY:-}
      - BROWSERBASE_PROJECT_ID=${BROWSERBASE_PROJECT_ID:-}
      - BB_BROWSERBASE_MONTHLY_HOURS=${BB_BROWSERBASE_MONTHLY_HOURS:-100}
      - BB_BROWSERBASE_MAX_CONCURRENT=${BB_BROWSERBASE_MAX_CONCURRENT:-25}
      - BB_BROWSERBASE_TIMEOUT=${BB_BROWSERBASE_TIMEOUT:-120}
    volumes:
      # Orgo computers: one driver per desktop at a time, across gateway restarts.
      - lane:/lane
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY:-256m}
          cpus: "${GATEWAY_CPUS:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [box]

networks:
  box:
    driver: bridge

volumes:
  lane:
